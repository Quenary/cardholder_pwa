<mat-dialog-content class="mat-dialog-content">
  <video
    #video
    class="mat-dialog-content-video"
    playsinline
    autoplay
    [muted]="true"
    (playing)="onVideoPlaying()"></video>
  @if (!isStarting()) {
    <div
      class="mat-dialog-content-viewfinder"
      aria-hidden="true">
      <div class="mat-dialog-content-viewfinder-frame"></div>
    </div>
  }
  @if (isStarting() || isDecodingFile()) {
    <div class="mat-dialog-content-overlay">
      <mat-spinner [diameter]="50"></mat-spinner>
    </div>
  }
</mat-dialog-content>
<mat-dialog-actions class="mat-dialog-actions">
  @if (hasTorch()) {
    <button
      mat-icon-button
      [attr.aria-label]="'CARDS.CARD.SCAN.TORCH' | translate"
      [attr.aria-pressed]="isTorchOn()"
      [matTooltip]="'CARDS.CARD.SCAN.TORCH' | translate"
      (click)="toggleTorch()">
      <mat-icon
        >{{ isTorchOn() ? 'flashlight_on' : 'flashlight_off' }}</mat-icon
      >
    </button>
  }
  <button
    mat-button
    [disabled]="!devices().length"
    (click)="onClickSelectDevice()">
    <mat-icon>videocam_outlined</mat-icon>
    @if (selectedDevice(); as device) {
      {{ device.label ?? device.deviceId }}
    } @else {
      {{ 'CARDS.CARD.SCAN.SELECT_SOURCE' | translate }}
    }
  </button>
  <button
    mat-button
    class="accent-color"
    [disabled]="isDecodingFile()"
    (click)="fileInput.click()">
    <mat-icon>image</mat-icon>
    {{ 'CARDS.CARD.SCAN.FROM_FILE' | translate }}
    <input
      #fileInput
      hidden
      type="file"
      id="card-scanner-from-file"
      accept="image/*"
      multiple="false"
      (change)="decodeFromFile($any($event))" />
  </button>
  <button
    mat-flat-button
    (click)="close()">
    {{ 'GENERAL.CLOSE' | translate }}
  </button>
</mat-dialog-actions>

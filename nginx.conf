worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        image/svg+xml
        text/css
        text/plain;

    server {
        listen 80;
        server_name localhost;

        # Frontend
        location /i18n/ {
            root /app/frontend;
            try_files $uri =404;
        }

        # Built assets carry a content hash in their name, so a given URL always
        # answers with the same bytes and can be cached for good.
        location ~* \.(?:js|css|woff2?)$ {
            root /app/frontend;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # index.html is the one file whose URL is stable while its content
        # changes on every release, so it must always be revalidated.
        location = /index.html {
            root /app/frontend;
            add_header Cache-Control "no-cache";
        }

        location / {
            root /app/frontend;
            try_files $uri $uri/ /index.html;
        }

        # Backend API
        location /api {
            # Must stay above LOGO_MAX_UPLOAD_BYTES (2 MiB by default), so that
            # an oversized logo is refused by the app with a readable message
            # instead of nginx's opaque 413 page.
            client_max_body_size 4m;
            proxy_pass http://localhost:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
